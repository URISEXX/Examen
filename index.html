<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Laboratorio DWI</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- Menú de navegación para la Vista Única (SPA) -->
    <nav>
        <button class="active" onclick="showApp('app1', this)">Calculador de Edad</button>
        <button onclick="showApp('app2', this)">Convertidor de Temperatura</button>
        <button onclick="showApp('app3', this)">Tareas</button>
    </nav>

    <div class="container">
        
        <!-- PROYECTO 1: Age Calculator -->
        <div id="app1" class="app-section active">
            <h2>Calculadora de Edad</h2>
            <p style="text-align: center;">Ingresa tu fecha de nacimiento:</p>
            <!-- Selector personalizado sin input type="date" -->
            <div class="date-selector">
                <select id="daySelect"><option value="">Dia</option></select>
                <select id="monthSelect">
                    <option value="">Mes</option>
                    <option value="0">Enero</option><option value="1">Febrero</option>
                    <option value="2">Marzo</option><option value="3">Abril</option>
                    <option value="4">Mayo</option><option value="5">Junio</option>
                    <option value="6">Julio</option><option value="7">Agosto</option>
                    <option value="8">Septiembre</option><option value="9">Octubre</option>
                    <option value="10">Noviembre</option><option value="11">Diciembre</option>
                </select>
                <select id="yearSelect"><option value="">Año</option></select>
            </div>
            <button class="btn" onclick="calculateAge()">Calcular</button>
            <div id="ageResult"></div>
        </div>

        <!-- PROYECTO 2: Temperature Converter -->
        <div id="app2" class="app-section">
            <h2>Convertidor de Temperatura</h2>
            <p style="text-align: center;">Ingresa la Temperatura</p>
            <div class="converter-group">
                <input type="number" id="tempValue" placeholder="0.00">
                <select id="fromUnit">
                    <option value="" disabled selected>Unidades</option>
                    <option value="Celsius">Celsius</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
                <select id="toUnit">
                    <option value="" disabled selected>Convertir a</option>
                    <option value="Celsius">Celsius</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
                <button class="btn" style="width: auto; margin-top: 0;" id="convertBtn" disabled onclick="convertTemp()">Convert</button>
            </div>
            <div id="tempResult"></div>
        </div>

        <!-- PROYECTO 3: Task Tracker -->
        <div id="app3" class="app-section">
            <h2>Tareas</h2>
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="Start writing and press enter to create task">
                <button onclick="addTask()">&#9166;</button>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>

    </div>

    <script>
        /* --- LÓGICA DE NAVEGACIÓN (SPA) --- */
        function showApp(appId, btnElement) {
            // Ocultar todas las secciones
            document.querySelectorAll('.app-section').forEach(section => {
                section.classList.remove('active');
            });
            // Quitar clase activa de todos los botones
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('active');
            });
            // Mostrar la sección seleccionada y resaltar el botón[span_1](start_span)[span_1](end_span)
            document.getElementById(appId).classList.add('active');
            btnElement.classList.add('active');
        }

        /* --- PROYECTO 1: AGE CALCULATOR --- */
        // Rellenar selectores de día y año[span_2](start_span)[span_2](end_span)
        const daySelect = document.getElementById('daySelect');
        const yearSelect = document.getElementById('yearSelect');
        for (let i = 1; i <= 31; i++) {
            daySelect.innerHTML += `<option value="${i}">${i}</option>`;
        }
        const currentYear = new Date().getFullYear();
        for (let i = currentYear; i >= 1900; i--) {
            yearSelect.innerHTML += `<option value="${i}">${i}</option>`;
        }

        function calculateAge() {
            const day = document.getElementById('daySelect').value;
            const month = document.getElementById('monthSelect').value;
            const year = document.getElementById('yearSelect').value;
            const resultDiv = document.getElementById('ageResult');

            if (!day || !month || !year) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = "Selecciona una fecha válida.";
                return;
            }

            const birthDate = new Date(year, month, day);
            const today = new Date();

            if (birthDate > today) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = "La fecha de nacimiento no puede ser en el futuro.";
                return;
            }

            let ageYears = today.getFullYear() - birthDate.getFullYear();
            let ageMonths = today.getMonth() - birthDate.getMonth();

            if (ageMonths < 0 || (ageMonths === 0 && today.getDate() < birthDate.getDate())) {
                ageYears--;
                ageMonths += 12;
            }
            if (today.getDate() < birthDate.getDate()) {
                ageMonths--;
                if (ageMonths < 0) { ageMonths = 11; }
            }

            resultDiv.style.color = '#1abc9c';
            resultDiv.innerText = `Tu tienes ${ageYears} Años y ${ageMonths} Meses `; //[span_3](start_span)[span_3](end_span)
        }


        /* --- PROYECTO 2: TEMPERATURE CONVERTER --- */
        const tempValueInput = document.getElementById('tempValue');
        const fromUnitSelect = document.getElementById('fromUnit');
        const toUnitSelect = document.getElementById('toUnit');
        const convertBtn = document.getElementById('convertBtn');

        // Función para validar y habilitar/deshabilitar el botón[span_4](start_span)[span_4](end_span)
        function checkConverterInputs() {
            if (tempValueInput.value !== '' && fromUnitSelect.value !== '' && toUnitSelect.value !== '') {
                convertBtn.disabled = false;
            } else {
                convertBtn.disabled = true;
            }
        }

        tempValueInput.addEventListener('input', checkConverterInputs);
        fromUnitSelect.addEventListener('change', checkConverterInputs);
        toUnitSelect.addEventListener('change', checkConverterInputs);

        function convertTemp() {
            const value = parseFloat(tempValueInput.value);
            const from = fromUnitSelect.value;
            const to = toUnitSelect.value;
            let result = 0;

            if (from === to) { result = value; }
            else if (from === "Celsius" && to === "Fahrenheit") { result = (value * 9/5) + 32; }
            else if (from === "Celsius" && to === "Kelvin") { result = value + 273.15; }
            else if (from === "Fahrenheit" && to === "Celsius") { result = (value - 32) * 5/9; }
            else if (from === "Fahrenheit" && to === "Kelvin") { result = (value - 32) * 5/9 + 273.15; }
            else if (from === "Kelvin" && to === "Celsius") { result = value - 273.15; }
            else if (from === "Kelvin" && to === "Fahrenheit") { result = (value - 273.15) * 9/5 + 32; }

            document.getElementById('tempResult').innerText = `${value} ${from} son ${result.toFixed(2)} ${to}`; //[span_5](start_span)[span_5](end_span)
        }


        /* --- PROYECTO 3: TASK TRACKER --- */
        // Arreglo interno de tareas[span_6](start_span)[span_6](end_span)
        let tasks = []; 

        const taskInput = document.getElementById('taskInput');
        
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        function addTask() {
            const desc = taskInput.value.trim();
            if (desc !== "") {
                tasks.push({ descripcion: desc, completada: false }); //[span_7](start_span)[span_7](end_span)
                taskInput.value = "";
                renderTasks(); //[span_8](start_span)[span_8](end_span)
            }
        }

        function toggleTask(index) {
            tasks[index].completada = !tasks[index].completada; //[span_9](start_span)[span_9](end_span)
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1); //[span_10](start_span)[span_10](end_span)
            renderTasks();
        }

        // Función dedicada para renderizar y reubicar las tareas[span_11](start_span)[span_11](end_span)
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = ""; 

            // Mostrar pendientes primero, luego completadas[span_12](start_span)[span_12](end_span)
            const pendingTasks = tasks.map((task, index) => ({...task, originalIndex: index})).filter(t => !t.completada);
            const completedTasks = tasks.map((task, index) => ({...task, originalIndex: index})).filter(t => t.completada);
            const sortedTasks = [...pendingTasks, ...completedTasks];

            sortedTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completada ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <input type="checkbox" ${task.completada ? 'checked' : ''} onchange="toggleTask(${task.originalIndex})">
                    <span>${task.descripcion}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.originalIndex})">🗑️</button>
                `;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
